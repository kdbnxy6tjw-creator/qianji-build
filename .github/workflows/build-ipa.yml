name: iOS Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List project files (debug)
        run: find . -maxdepth 3 -type f | head -80

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true

      - name: Show toolchain
        run: xcodebuild -version; swift --version

      - name: Build unsigned app (direct xcodebuild)
        run: |
          chmod +x scripts/*.sh
          xcodebuild \
            -project MoneyNote.xcodeproj \
            -scheme QianJi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/QianJi.xcarchive \
            clean archive CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          mkdir -p Payload
          cp -R $RUNNER_TEMP/QianJi.xcarchive/Products/Applications/QianJi.app Payload/
          zip -qr QianJi-v2.0.0.ipa Payload

      - name: Verify IPA
        run: |
          test -f QianJi-v2.0.0.ipa
          unzip -l QianJi-v2.0.0.ipa | grep -E "Payload/QianJi.app/(QianJi|Info.plist)"
          echo "IPA verified OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QianJi-IPA
          path: QianJi-v2.0.0.ipa
